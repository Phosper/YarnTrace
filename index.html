<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f1ecff" />
    <meta name="description" content="点一下，让毛线顺着箭头溜走，把整张像素画拆干净。不限时、不会失败。" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="YarnTrace" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>YarnTrace · 剥图消消</title>
  </head>
  <body>
    <div id="app">
      <canvas id="board"></canvas>
      <header id="hud">
        <button id="btn-levels" class="chip" aria-label="选关" title="选关"></button>
        <div class="title">
          <div id="level-name">第 1 关</div>
          <div class="meter-row">
            <div class="meter"><i id="meter-fill"></i></div>
            <span id="level-progress">0 / 0</span>
          </div>
        </div>
        <button id="btn-settings" class="chip" aria-label="设置" title="设置"></button>
      </header>
      <div id="combo" aria-hidden="true"></div>
      <div id="coach" class="hidden"></div>
      <footer id="bar">
        <button id="btn-restart" class="chip" aria-label="重来" title="重来"></button>
        <button id="btn-hint" class="pill" title="提示"><span>提示</span></button>
        <button id="btn-fit" class="chip" aria-label="复位视角" title="复位视角"></button>
      </footer>
      <div id="toast" role="status"></div>
      <div id="overlay" class="hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
