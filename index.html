<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e8e6f7" />
    <title>YarnTrace · 剥图消消</title>
  </head>
  <body>
    <div id="app">
      <canvas id="board"></canvas>
      <header id="hud">
        <div class="hud-side">
          <button id="btn-settings" class="icon" title="设置">⚙</button>
          <button id="btn-restart" class="icon" title="重来">↺</button>
        </div>
        <div class="hud-title">
          <div id="level-name">关卡 1</div>
          <div id="level-progress">0 / 0</div>
        </div>
        <div class="hud-side">
          <button id="btn-levels" class="icon" title="选关">☰</button>
        </div>
      </header>
      <footer id="bar">
        <button id="btn-hint" class="round" title="提示">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path
              d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3zM9.5 19h5M10.5 22h3"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <input id="zoom" type="range" min="0.35" max="3" step="0.01" value="1" />
        <button id="btn-guides" class="round active" title="辅助线">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path
              d="M9 3v18M15 3v18M3 9h18M3 15h18"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </footer>
      <div id="overlay" class="hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
